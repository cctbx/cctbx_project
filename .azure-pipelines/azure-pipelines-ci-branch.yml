# Templates for linux, macOS, and Windows
# Based on approach from conda-forge

# skip pull requests
pr: none

# batch builds for branches
trigger:
  batch: true
  branches:
    exclude:
      - master
      - releases/*

resources:
  pipelines:
  - pipeline: data_cache
    source: 'Update data cache'
  - pipeline: build_cache
    source: 'Update build cache'
  - pipeline: ci
    source: 'CI'

# the pipeline whose latest run on master has the test timings, which order
# the tests longest first; branch runs only read them
variables:
  - name: timings_pipeline
    value: $(resources.pipeline.ci.pipelineID)

stages:
- stage: Preparation
  displayName: Download
  jobs:
    - template: ./download-source.yml

- stage: Build
  displayName: Build and test
  dependsOn: Preparation
  jobs:
    - template: ./ci-build.yml
      parameters:
        modules: modules
